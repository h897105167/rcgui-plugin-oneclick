[package]
name = "rcgui-plugin-oneclick"
version = "0.3.1"
edition = "2021"
description = "RCGUI 插件：一键安装/配置 rclone 与远程"
license = "MIT"
repository = "https://github.com/h897105167/rcgui-plugin-oneclick"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
